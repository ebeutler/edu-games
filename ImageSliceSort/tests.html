<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Image Slice Sort checks</title>
	<script src="assets/algorithms.js"></script>
</head>
<body>
	<h1>Image Slice Sort algorithm checks</h1>
	<pre id="results">Running...</pre>
	<script>
		(function () {
			"use strict";

			const cases = [
				[],
				[0],
				[1, 0],
				[4, 1, 3, 0, 2],
				[7, 6, 5, 4, 3, 2, 1, 0],
				[2, 1, 2, 0, 1]
			];
			const messages = [];

			Object.keys(window.ImageSliceSortAlgorithms.definitions).forEach(function (name) {
				cases.forEach(function (input) {
					const values = input.slice();
					const expected = input.slice().sort(function (left, right) { return left - right; });
					const events = Array.from(window.ImageSliceSortAlgorithms.create(name, values));
					if (JSON.stringify(values) !== JSON.stringify(expected)) {
						throw new Error(name + " failed for " + JSON.stringify(input));
					}
					if (events.some(function (event) {
						return !event.comparison && !event.moved;
					})) {
						throw new Error(name + " emitted an empty event");
					}
				});
				messages.push("PASS: " + name);
			});

			document.getElementById("results").textContent = messages.join("\n") + "\n\nAll checks passed.";
		})();
	</script>
</body>
</html>
