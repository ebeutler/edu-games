<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Image Slice Sort checks</title>
	<script src="assets/algorithms.js"></script>
	<script src="assets/race.js"></script>
</head>
<body>
	<h1>Image Slice Sort algorithm checks</h1>
	<pre id="results">Running...</pre>
	<script>
		(function () {
			"use strict";

			const cases = [
				[],
				[0],
				[1, 0],
				[4, 1, 3, 0, 2],
				[7, 6, 5, 4, 3, 2, 1, 0],
				[2, 1, 2, 0, 1]
			];
			const messages = [];
			const definitions = window.ImageSliceSortAlgorithms.definitions;

			const sorted = function (values) {
				return values.slice().sort(function (left, right) { return left - right; });
			};

			const runCase = function (name, input) {
				const values = input.slice();
				const expected = sorted(input);
				const events = [];
				for (const event of window.ImageSliceSortAlgorithms.create(name, values)) {
					events.push(event);
					if (event.comparison === event.moved) {
						throw new Error(name + " did not separate comparison and movement events");
					}
					const indices = event.indices.concat(event.accentIndices || []);
					if (indices.some(function (index) { return index < 0 || index >= values.length; })) {
						throw new Error(name + " emitted an invalid slice index");
					}
					if (JSON.stringify(sorted(values)) !== JSON.stringify(expected)) {
						throw new Error(name + " lost a slice while sorting");
					}
				}
				if (JSON.stringify(values) !== JSON.stringify(expected)) {
					throw new Error(name + " failed for " + JSON.stringify(input));
				}
				return events;
			};

			Object.keys(definitions).forEach(function (name) {
				if (name === "bogo") {
					return;
				}
				cases.forEach(function (input) {
					if (definitions[name].supportsDuplicates !== false || new Set(input).size === input.length) {
						runCase(name, input);
					}
				});
				messages.push("PASS: " + name);
			});

			const originalRandom = Math.random;
			Math.random = function () { return 0; };
			try {
				runCase("bogo", [1, 0]);
			} finally {
				Math.random = originalRandom;
			}
			messages.push("PASS: bogo with deterministic shuffle");

			const bubbleValues = [1, 0];
			const bubble = window.ImageSliceSortAlgorithms.create("bubble", bubbleValues);
			const bubbleComparison = bubble.next().value;
			if (!bubbleComparison.comparison || bubbleValues[0] !== 1 || bubbleValues[1] !== 0) {
				throw new Error("bubble moved slices during its comparison event");
			}
			const bubbleMove = bubble.next().value;
			if (!bubbleMove.moved || bubbleValues[0] !== 0 || bubbleValues[1] !== 1) {
				throw new Error("bubble did not defer movement to the next event");
			}
			messages.push("PASS: comparisons precede movements");

			const mergeValues = [3, 2, 1, 0];
			const mergeSnapshots = [];
			for (const event of window.ImageSliceSortAlgorithms.create("merge", mergeValues)) {
				if (event.moved) {
					mergeSnapshots.push(JSON.stringify(mergeValues));
				}
			}
			if (!mergeSnapshots.includes("[0,2,3,1]")) {
				throw new Error("merge did not expose its in-place movements");
			}
			messages.push("PASS: merge moves in place");

			const quickEvents = runCase("quick", [3, 1, 2, 0]);
			if (quickEvents.some(function (event) { return event.accentIndices.length === 0; })) {
				throw new Error("quick did not retain its pivot marker");
			}
			messages.push("PASS: quick identifies pivots");

			const radixEvents = runCase("radix", [12, 2, 21, 1]);
			if (radixEvents.some(function (event) { return event.comparison; })) {
				throw new Error("radix emitted comparison events");
			}
			messages.push("PASS: radix uses movement events");

			if (definitions.bogo.maxSlices !== 8 || definitions.stooge.maxSlices !== 64) {
				throw new Error("novelty algorithm limits are missing");
			}
			messages.push("PASS: novelty limits");

			const firstRun = window.ImageSliceSortRace.createRun("first", "bubble");
			const secondRun = window.ImageSliceSortRace.createRun("second", "bubble");
			window.ImageSliceSortRace.resetRun(firstRun, [1, 0]);
			window.ImageSliceSortRace.resetRun(secondRun, [1, 0]);
			if (firstRun.values === secondRun.values) {
				throw new Error("race runs share their mutable slice array");
			}
			window.ImageSliceSortRace.advanceRun(firstRun, true);
			if (!firstRun.lastEvent.comparison || firstRun.values[0] !== 1) {
				throw new Error("race comparison advanced too far");
			}
			window.ImageSliceSortRace.advanceRun(firstRun, true);
			if (!firstRun.lastEvent.moved || firstRun.values[0] !== 0 || secondRun.values[0] !== 1) {
				throw new Error("race runs are not independent");
			}
			window.ImageSliceSortRace.advanceRun(secondRun, false);
			if (secondRun.lastEvent || secondRun.comparisons !== 1) {
				throw new Error("race did not count and hide a raw comparison");
			}
			messages.push("PASS: independent race runners");

			document.getElementById("results").textContent = messages.join("\n") + "\n\nAll checks passed.";
		})();
	</script>
</body>
</html>
